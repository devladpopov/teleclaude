name: CI

on:
  push:
    branches: [main, executor-opencode]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (router)
        run: bun install

      - name: Install (runner)
        run: bun install
        working-directory: runner

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
